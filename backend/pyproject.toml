[project]
name = "nexa-agent"
version = "1.0.0"
description = "Multilingual business AI agent with Text-to-SQL, RAG and hybrid reasoning."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "sqlglot>=25.30",
    "httpx>=0.28",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "fastembed>=0.4",
    "numpy>=1.26",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # Bengali characters are intentional
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends() in defaults
    "SIM905", # word lists written as str.split() are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"app/prompts/**" = ["E501"]  # prompt examples contain long, verbatim SQL lines
"scripts/**" = ["S311"]
"evaluation/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL with pgvector",
]

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
