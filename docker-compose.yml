name: nexa-agent

# Development stack. For a production-style deployment layer the override file on top:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexa}
      POSTGRES_USER: ${POSTGRES_USER:-nexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexa_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # Append-only file so queued indexing jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexa}:${POSTGRES_PASSWORD:-nexa_dev_password}@postgres:5432/${POSTGRES_DB:-nexa}
      UPLOAD_DIR: /data/uploads
      FASTEMBED_CACHE_DIR: /data/models
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      # Trust X-Forwarded-For from the bundled nginx. Only safe because, in production, the
      # backend has no published port; behind a different proxy set this to its address.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      # Readiness: database reachable and migrations at head.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"

  # Optional local model server: `docker compose --profile local-llm up`
  # then set LLM_BASE_URL=http://ollama:11434/v1 and pull a model:
  # `docker compose exec ollama ollama pull qwen2.5:7b-instruct`
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  redis_data:
  postgres_data:
  backend_data:
  ollama_data:
