# Install once with:  pip install pre-commit && pre-commit install
# Run on everything:   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: package-lock\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend exec -- prettier --write --ignore-unknown
        language: system
        files: ^frontend/.*\.(ts|tsx|js|json|css|html|md)$
        exclude: package-lock\.json$
      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend exec -- eslint --max-warnings=0
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
