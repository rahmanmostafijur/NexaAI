# Production override. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What changes compared to the development stack:
#   * no host ports for PostgreSQL, Redis or the backend; only the frontend (nginx) is published,
#     put your TLS-terminating proxy in front of it
#   * ENVIRONMENT=production (the app refuses default secrets), demo seeding off
#   * indexing runs on a durable Redis queue with a separate worker; rate limits live in Redis
#   * Redis requires a password; restart policies, resource limits and dropped capabilities
#   * every service has a health check; the frontend waits for a ready backend
#
# Required variables (compose refuses to start without them): POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, ADMIN_PASSWORD, SQL_READONLY_PASSWORD, plus LLM_* for your model provider.
# The backend and worker share the `backend_data` volume for uploaded files, so they must run on
# the same host (use object storage if you need to spread them across machines).

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexa}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexa}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  INGESTION_BACKEND: arq
  RATE_LIMIT_BACKEND: redis
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
  SQL_READONLY_PASSWORD: ${SQL_READONLY_PASSWORD:?Set SQL_READONLY_PASSWORD}
  UPLOAD_DIR: /data/uploads
  FASTEMBED_CACHE_DIR: /data/models
  SEED_ON_STARTUP: "false"

x-hardening: &hardening
  restart: always
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    restart: always
    security_opt:
      - no-new-privileges:true
    # The official image needs a few capabilities at start-up to drop privileges, so no cap_drop.
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    mem_limit: 1g
    cpus: 1.0

  redis:
    <<: *hardening
    ports: !reset []
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    mem_limit: 256m
    cpus: 0.5

  backend:
    <<: *hardening
    image: nexa-agent-backend:${NEXA_IMAGE_TAG:-1.0.0}
    ports: !reset []
    expose:
      - "8000"
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0

  worker:
    <<: *hardening
    image: nexa-agent-backend:${NEXA_IMAGE_TAG:-1.0.0}
    build:
      context: ./backend
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment: *backend-environment
    volumes:
      - backend_data:/data
    depends_on:
      backend:
        condition: service_healthy  # migrations have been applied
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    mem_limit: 2g
    cpus: 2.0

  frontend:
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
    mem_limit: 128m
    cpus: 0.5
